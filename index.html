                    {
                        num: 22,
                        enunciado: "Decide si cada igualdad es una identidad y elige la justificación correcta. Considera valores para los que todos los logaritmos están definidos.",
                        apartados: [
                            { texto: "a) \\(\\log m + \\log n = \\log(m + n)\\)", correcta: "Falsa. La suma da log(mn).", errores: [["Verdadera. Se suman los argumentos.","La suma de logaritmos corresponde a un producto."],["Falsa. La suma da log(\\(\\frac{m}{n}\\)).","El cociente corresponde a una resta de logaritmos."],["Verdadera. Basta que m y n sean positivos.","La positividad permite calcular ambos logaritmos, pero no convierte la suma de argumentos en producto."]] },
                            { texto: "b) \\(\\log m - \\log n = \\log(m/n)\\)", correcta: "Verdadera. El argumento es \\(\\frac{m}{n}\\).", errores: [["Falsa. El argumento es m − n.","La diferencia se traslada a un cociente."],["Verdadera. El argumento también puede ser \\(\\frac{n}{m}\\).","Invertir el cociente cambia el signo del logaritmo."],["Falsa. Hay que dividir los logaritmos.","Un cociente de logaritmos se usa en el cambio de base."]] },
                            { texto: "c) \\(\\log x^3 = 3\\log x\\)", correcta: "Verdadera. El exponente pasa a ser un factor.", errores: [["Falsa. Debe ser (log x)³.","Elevar el argumento al cubo multiplica el logaritmo por 3."],["Verdadera. También equivale a log(3x).","El logaritmo de 3x se desarrolla como log 3 + log x."],["Falsa. Debe ser log x + 3.","Sumar 3 equivaldría a multiplicar el argumento por 1000."]] },
                            { texto: "d) \\(\\log(a^2 - b^2) = \\log(a+b) + \\log(a-b)\\)", correcta: "Verdadera. a² − b² = (a+b)(a−b).", errores: [["Falsa. Una suma de logaritmos exige sumar argumentos.","Una suma de logaritmos corresponde al producto de los argumentos."],["Verdadera. a² − b² = (a−b)².","El cuadrado de la diferencia contiene un término −2ab y un término +b²."],["Falsa. Se necesita log(a+b) − log(a−b).","La resta produciría un cociente. Aquí la factorización da un producto."]] }
                        ]
                    }
                ]
            }
        };

        const state = { seccionActual: null, respuestas: {} };
        try { localStorage.removeItem('respuestas4ESOVersionB'); } catch {}

        for (const seccion of Object.values(ejercicios)) {
            for (const pregunta of seccion.preguntas) {
                for (const ap of pregunta.apartados) {
                    ap.opciones = [[ap.correcta, null], ...ap.errores];
                    for (let i = 3; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [ap.opciones[i], ap.opciones[j]] = [ap.opciones[j], ap.opciones[i]];
                    }
                }
            }
        }
        function verSeccion(seccion) { state.seccionActual = seccion; render(); }
        function volverInicio() { verSeccion(null); }
        function imprimirExamen() { window.print(); }
        window.addEventListener('pageshow', event => {
            if (event.persisted) { state.respuestas = {}; volverInicio(); }
        });

        function seleccionar(key, indice) {
            if (state.respuestas[key]?.confirmada) return;
            state.respuestas[key] = { indice, confirmada: false };
            document.getElementById('btn-' + key).disabled = false;
        }

        function comprobar(num, idx) {
            const key = num + '-' + idx;
            const respuesta = state.respuestas[key];
            if (!respuesta || respuesta.confirmada) return;
            respuesta.confirmada = true;
            const ap = ejercicios[state.seccionActual].preguntas.find(p => p.num === num).apartados[idx];
            const campo = document.getElementById('campo-' + key);
            campo.disabled = true;
            document.getElementById('btn-' + key).disabled = true;
            const mensaje = document.getElementById('resultado-' + key);
            mensaje.textContent = resultado(ap, respuesta);
            if (window.MathJax?.typesetPromise) MathJax.typesetPromise([mensaje]).catch(console.error);
        }
        function resultado(ap, respuesta) {
            if (!respuesta?.confirmada) return '';
            const motivo = ap.opciones[respuesta.indice][1];
            return motivo ? 'Incorrecto. ' + motivo + ' Respuesta correcta: ' + ap.correcta : 'Correcto';
        }

        function render() {
            const app = document.getElementById('app');

            app.innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 p-4">
                    <div class="max-w-7xl mx-auto">
                        ${renderHeader()}
                        ${state.seccionActual ? renderSeccion() : renderMenuPrincipal()}
                    </div>
                </div>
            `;

            if (window.MathJax) {
                MathJax.typesetPromise().catch((err) => console.log(err));
            }
        }

        function renderHeader() {
            const totalPreguntas = Object.values(ejercicios).reduce((sum, sec) => sum + sec.preguntas.length, 0);
            return `
                <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl shadow-2xl p-8 mb-8 text-white no-print">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-4">
                        <div class="flex items-center gap-4">
                            <div class="text-5xl">📐</div>
                            <div>
                                <h1 class="text-4xl font-bold mb-2">Examen Matemáticas 4º ESO</h1>
                                <p class="text-indigo-100 text-lg">1ª Evaluación - Versión B · ${totalPreguntas} preguntas</p>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            ${state.seccionActual ? '<button onclick="volverInicio()" class="bg-white text-indigo-600 px-4 py-2 rounded-xl hover:bg-indigo-50 transition shadow-lg font-medium">🏠 Inicio</button>' : ''}
                            <button onclick="imprimirExamen()" class="bg-green-500 text-white px-4 py-2 rounded-xl hover:bg-green-600 transition shadow-lg font-medium">
                                🖨️ Imprimir
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMenuPrincipal() {
            return `
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">📋 Selecciona una Sección</h2>
                    <div class="grid md:grid-cols-3 gap-6">
                        ${Object.entries(ejercicios).map(([key, seccion]) => `
                            <div onclick="verSeccion('${key}')" 
                                class="bg-gradient-to-br ${seccion.color} rounded-2xl shadow-xl p-8 cursor-pointer transform transition-all duration-300 hover:scale-105 text-white">
                                <h3 class="font-bold text-2xl mb-4">${seccion.title}</h3>
                                <p class="text-white text-opacity-90 mb-4">${seccion.preguntas.length} preguntas</p>
                                <div class="flex items-center text-white font-medium">Comenzar →</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSeccion() {
            const seccion = ejercicios[state.seccionActual];
            return `
                <div>
                    <div class="bg-gradient-to-r ${seccion.color} rounded-2xl shadow-xl p-8 mb-8 text-white">
                        <h2 class="text-3xl font-bold">${seccion.title}</h2>
                        <p class="text-white text-opacity-90 mt-2">${seccion.preguntas.length} preguntas · Elige una opción y pulsa Comprobar. Tienes un intento por apartado.</p>
                    </div>
                    <div class="space-y-6">
                        ${seccion.preguntas.map(pregunta => renderPregunta(pregunta)).join('')}
                    </div>
                </div>
            `;
        }

        function renderPregunta(preg) {
            return `
                <div class="bg-white rounded-xl shadow-lg p-6 border-2 border-gray-200 hover:border-indigo-300 transition">
                    <div class="flex items-start gap-4">
                        <span class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-full text-sm font-bold min-w-fit">#${preg.num}</span>
                        <div class="flex-1">
                            <div class="text-lg font-semibold text-gray-800 mb-3">${preg.enunciado}</div>
                            ${preg.detalle ? `<p class="text-gray-600 mb-3">${preg.detalle}</p>` : ''}
                            ${preg.formula ? `<div class="math-display bg-gray-50 p-4 rounded-lg mb-4">$$${preg.formula}$$</div>` : ''}
                            
                            <div class="space-y-3">
                                ${preg.apartados.map((ap, idx) => renderApartado(preg.num, ap, idx)).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // [extremo izquierdo, extremo derecho, incluye izquierdo, incluye derecho]
        const trazados = {
            'x ≤ 2': [null, 2, false, true], 'x ≥ 2': [2, null, true, false],
            'x < 2': [null, 2, false, false], 'x > 2': [2, null, false, false],
            '−1 ≤ x < 5': [-1, 5, true, false], '−1 ≤ x > 5': [5, null, false, false],
            '−1 < x ≤ 5': [-1, 5, false, true], '−1 ≥ x < 5': [null, -1, false, true],
            '[−1, 2]': [-1, 2, true, true], '(−1, 2]': [-1, 2, false, true],
            '[−1, 2)': [-1, 2, true, false], '(−∞, 5)': [null, 5, false, false]
        };
        function recta(texto) {
            const [a, b, incluyeA, incluyeB] = trazados[texto];
            const situar = n => 50 + (n + 1) * 20;
            const extremo = (x, cerrado) => `<circle cx="${x}" cy="12" r="4" fill="${cerrado ? '#334699' : 'white'}" stroke="#334699" stroke-width="2"/>`;
            const marcas = [-1, 2, 5].map(n => `<path d="M${situar(n)} 8v8" stroke="#555"/><text x="${situar(n)}" y="32" text-anchor="middle" font-size="12">${n}</text>`).join('');
            return `<svg aria-hidden="true" width="220" height="36" viewBox="0 0 220 36" style="max-width:100%">
                <path d="M5 12h210" stroke="#aaa"/>${marcas}
                <line x1="${a === null ? 7 : situar(a)}" x2="${b === null ? 213 : situar(b)}" y1="12" y2="12" stroke="#334699" stroke-width="4"/>
                ${a === null ? '<path d="M13 6l-8 6 8 6" fill="none" stroke="#334699" stroke-width="3"/>' : extremo(situar(a), incluyeA)}
                ${b === null ? '<path d="M207 6l8 6-8 6" fill="none" stroke="#334699" stroke-width="3"/>' : extremo(situar(b), incluyeB)}
            </svg>`;
        }
        function escapar(texto) {
            return texto.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
        }

        function renderApartado(num, ap, idx) {
            const key = num + '-' + idx;
            const r = state.respuestas[key];
            return `<div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-4">
                <fieldset id="campo-${key}" ${r?.confirmada ? 'disabled' : ''}>
                    <legend class="mb-2 font-medium">${ap.texto}</legend>
                    ${ap.opciones.map(([texto], i) => `<label class="block bg-white rounded p-2 mb-2 border">
                        <input type="radio" name="op-${key}" onchange="seleccionar('${key}', ${i})" ${r?.indice === i ? 'checked' : ''}>
                        ${escapar(texto)} ${num === 2 ? recta(texto) : ''}
                    </label>`).join('')}
                </fieldset>
                <button id="btn-${key}" class="no-print bg-indigo-700 text-white rounded px-4 py-2 disabled:opacity-50" onclick="comprobar(${num}, ${idx})" ${!r || r.confirmada ? 'disabled' : ''}>Comprobar</button>
                <p id="resultado-${key}" role="status" class="mt-2 font-medium">${escapar(resultado(ap,r))}</p>
            </div>`;
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
